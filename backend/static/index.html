<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=320, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FPV Tuner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="app-header">
    <span id="app-title">FPV TUNER</span>
    <span id="fc-dot" class="dot unknown" aria-live="polite" title="FC connection"></span>
  </header>
  <main id="screen" aria-live="polite">
    <!-- Entire UI is rendered here by app.js as an explicit state machine.
         No static per-view markup: at 320x240 there are too many distinct
         screens (idle, detected, connecting, connected, downloading,
         analyzing, 6 paginated result cards, 4 paginated tune-review cards,
         applying, applied, error, optional history) for hand-authored
         show/hide sections to stay manageable -- see app.js's SCREENS. -->
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
